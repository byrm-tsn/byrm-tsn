<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Bayram Tosun — code, curiosity, and a camera.</title>
<desc id="desc">Software developer and Computer Science BSc and MSc graduate in London. A friendly camera companion floats, blinks, waves, and notices code, learning, and photographs. Animation stops when reduced motion is enabled.</desc>
<style>
@keyframes hover {0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes blink {0%,40%,44%,76%,80%,100%{transform:scaleY(1)}42%,78%{transform:scaleY(.08)}}
@keyframes look {0%,18%,100%{transform:translate(0,0)}27%,42%{transform:translate(-7px,-3px)}52%,69%{transform:translate(8px,0)}78%,89%{transform:translate(0,3px)}}
@keyframes wave {0%,12%,49%,100%{transform:rotate(0deg)}20%,32%,44%{transform:rotate(-28deg)}26%,38%{transform:rotate(-8deg)}}
@keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes breathe {0%,100%{transform:scaleX(1);opacity:.3}50%{transform:scaleX(.85);opacity:.18}}
@keyframes signal {0%,100%{opacity:.35}50%{opacity:1}}
@keyframes idea {0%,12%,70%,100%{opacity:0;transform:translateY(5px)}20%,60%{opacity:1;transform:translateY(0)}}
@keyframes shutter {0%,57%,64%,100%{opacity:0;transform:scale(.6)}60%{opacity:.8;transform:scale(1)}}
@keyframes roleA {0%,27%,100%{opacity:1;transform:translateY(0)}32%,94%{opacity:0;transform:translateY(-6px)}}
@keyframes roleB {0%,29%,65%,100%{opacity:0;transform:translateY(6px)}35%,60%{opacity:1;transform:translateY(0)}}
@keyframes roleC {0%,62%,98%,100%{opacity:0;transform:translateY(6px)}69%,93%{opacity:1;transform:translateY(0)}}
@keyframes travel {0%{transform:translateX(-18px);opacity:0}8%,89%{opacity:1}100%{transform:translateX(670px);opacity:0}}
@keyframes twinkle {0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.buddy{animation:hover 6s cubic-bezier(.45,0,.55,1) infinite}
.eyes{animation:blink 7.2s linear infinite;transform-box:fill-box;transform-origin:center}
.gaze{animation:look 18s cubic-bezier(.45,0,.55,1) infinite}
.arm{animation:wave 9s cubic-bezier(.45,0,.55,1) infinite}
.float-a{animation:float 5.5s cubic-bezier(.45,0,.55,1) infinite}
.float-b{animation:float 7s cubic-bezier(.45,0,.55,1) -2s infinite}
.float-c{animation:float 6s cubic-bezier(.45,0,.55,1) -4s infinite}
.shadow{animation:breathe 6s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:center}
.signal{animation:signal 3s ease-in-out infinite}
.dot2{animation-delay:.25s}.dot3{animation-delay:.5s}
.idea{opacity:0;animation:idea 9s ease-in-out infinite}
.shutter{opacity:0;animation:shutter 12s ease-in-out infinite}
.role-a{animation:roleA 15s ease-in-out infinite}
.role-b{opacity:0;animation:roleB 15s ease-in-out infinite}
.role-c{opacity:0;animation:roleC 15s ease-in-out infinite}
.spark{animation:twinkle 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.traveller{animation:travel 12s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.role-a{opacity:1}.role-b,.role-c,.shutter,.idea{opacity:0}.traveller{opacity:0}.shadow{opacity:.22}}
</style>
<rect x=".5" y=".5" width="479" height="609" rx="22" fill="#141b20" stroke="#33434b"/>
<g font-family="Trebuchet MS, Avenir Next, Segoe UI, sans-serif">

