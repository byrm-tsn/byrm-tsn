<g class="role-a"><text x="30" y="220" font-size="20" fill="#f69b7a" font-weight="600" >Building useful software.</text></g>
<g class="role-b"><text x="30" y="220" font-size="20" fill="#f69b7a" font-weight="600" >Exploring machine learning.</text></g>
<g class="role-c"><text x="30" y="220" font-size="20" fill="#f69b7a" font-weight="600" >Seeing through a different lens.</text></g>
