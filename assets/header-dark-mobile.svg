<g fill="#f69b7a"><circle class="signal" cx="37" cy="60" r="1.7"/><circle class="signal dot2" cx="45" cy="60" r="1.7"/><circle class="signal dot3" cx="53" cy="60" r="1.7"/></g>
</g></g></g>
