name: Refresh profile

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the renderer and public-data parser
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch public data and render profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_stats.py
          python scripts/render_profile.py
      - name: Publish refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile statistics'
            git push
          fi
